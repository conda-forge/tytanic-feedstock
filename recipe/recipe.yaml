schema_version: 1

context:
  name: tytanic
  version: "0.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/tingerrr/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 9acdf96fba301efb4b92cf5b67f6a2b454315aaf3aea79c0a68a13644b2881a8

build:
  number: 1

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - if: linux
      then: openssl
  run:
    - if: linux
      then: openssl

tests:
  - script:
      - tt --version

about:
  summary: Visual regression test runner for Typst packages.
  description: |
    Tytanic is a test runner for Typst projects. It helps you worry less about
    regressions and speeds up your development.
  license: MIT or Apache-2.0
  license_file:
    - LICENSE.MIT
    - LICENSE.Apache-2.0
    - THIRDPARTY_LICENSES.yaml
  homepage: https://typst-community.github.io/tytanic/
  repository: https://github.com/tingerrr/tytanic
  documentation: https://typst-community.github.io/tytanic/

extra:
  recipe-maintainers:
    - freundTech
